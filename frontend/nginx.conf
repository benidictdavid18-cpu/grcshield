# Serves the built single-page application and proxies /api to the API container.
#
# The security headers (security-headers.conf) are the page's own. The API sets its own
# on every JSON response (backend/app/core/headers.py); this is the server that holds
# the page where the token lives, so this is where the CSP that protects it belongs.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The page's headers go on the page locations below, not here: a server-level
    # add_header is inherited by /api/ too, and the API sets its own stricter CSP on
    # every JSON response. Two CSP headers are both enforced, which is harmless, but
    # one header per response is the state a reader can reason about.

    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The API keys its login throttle on the client address, so the real one has
        # to reach it. The API trusts this header only because, in the base compose
        # file, nothing but this proxy can reach the API at all.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Hashed assets can be cached forever; index.html must not be.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
