# Included in each page-serving location (not at the server level, which /api/ would
# inherit; the API sets its own headers).
# The bundle is a module script with no inline scripts, so script-src is 'self'.
# Styles allow inline because the build emits a few style attributes.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy no-referrer always;
