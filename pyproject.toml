# Lint configuration for the backend package and the repository scripts. Test
# configuration lives in backend/pyproject.toml, next to the tests.

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend"]
extend-exclude = ["backend/alembic/versions", "frontend", "docs"]

[tool.ruff.lint]
# E/F: pyflakes + pycodestyle errors. I: import ordering. B: bugbear (the mutable
# default argument, the bare re-raise inside an except). UP: modern syntax for the
# declared target. The set is deliberately small; a lint rule that fires on style
# nobody agreed to is a rule people learn to silence.
select = ["E", "F", "I", "B", "UP"]
ignore = [
  "E501",  # line length is the formatter's job; long strings in seed data are fine
  "B008",  # `Depends()` in a default argument is the FastAPI idiom
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
