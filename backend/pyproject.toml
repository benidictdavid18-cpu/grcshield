[tool.pytest.ini_options]
testpaths = ["tests"]
# Puts the backend directory on sys.path, so `import app` and `from tests.x import ...`
# work whether the suite is started as `pytest` or `python -m pytest`. Only the latter
# adds the working directory itself, which is why a bare `pytest` used to fail.
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning:reportlab.*"]
